plugins {
    id 'com.android.application'
}

android {
    namespace 'com.spatial.realitylauncher'
    compileSdk 34

    defaultConfig {
        applicationId "com.spatial.realitylauncher"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
    }

    // MediaPipe uses TFLite models in assets, prevent compression
    aaptOptions {
        noCompress "tflite"
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Google ARCore
    implementation 'com.google.ar:core:1.48.0'

    // Google MediaPipe Tasks Vision (Hand tracking, landmark detection)
    implementation 'com.google.mediapipe:tasks-vision:0.10.14'

    // AndroidX Lifecycle & Concurrency
    implementation 'androidx.lifecycle:lifecycle-runtime:2.7.0'
    implementation 'androidx.concurrent:concurrent-futures:1.1.0'

    // Unit test & instrumentation
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
