plugins {
    id 'com.android.application'
}

android {
    namespace 'com.spatial.realitylauncher'
    compileSdk 34

    defaultConfig {
        applicationId "com.spatial.realitylauncher"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
    }

    // MediaPipe uses .tflite and .task model bundles in assets; prevent compression
    aaptOptions {
        noCompress "tflite", "task"
    }

    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/ASL2.0'
            ]
        }
    }
}

dependencies {
    // AndroidX & Material UI
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.7.0'
    implementation 'androidx.concurrent:concurrent-futures:1.1.0'

    // Google ARCore (Latest stable SLAM 6DoF engine)
    implementation 'com.google.ar:core:1.46.0'

    // AndroidX CameraX (Camera2 abstraction, lifecycles, and image stream buffers)
    def camerax_version = "1.3.4"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // Google MediaPipe Tasks Vision (Hand tracking, landmark detection, gesture recognition)
    implementation 'com.google.mediapipe:tasks-vision:0.10.14'

    // Avoid ListenableFuture duplicate class conflict between Guava, CameraX, and MediaPipe
    implementation 'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava'

    // Unit test & instrumentation
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
